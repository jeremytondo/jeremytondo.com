# Build, test and deploy. Pull requests build and test, and upload the resume PDF as an
# artifact. Pushes to main (and manual runs on main) do the same, then deploy dist/ to
# the `jeremytondo-com` Worker.
# Builds run here rather than in Cloudflare Workers Builds because the PDF step needs
# Chromium's system libraries, which only an image with root (apt) can install.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR (newer pushes cancel older ones). Deploys to main queue instead,
  # so a deploy is never cut off halfway.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Restore Chromium before `npm ci`, so the postinstall download is a no-op on a
      # cache hit. Browser builds are tied to the Playwright version, so key on that.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The postinstall step downloads Chromium if the cache missed.
      - run: npm ci

      # The browser is already in place, so this only installs Chromium's system
      # libraries (apt).
      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: dist/resume/*.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Workers
        # Pushes to main, or a manual run on main (to redeploy without a commit).
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
